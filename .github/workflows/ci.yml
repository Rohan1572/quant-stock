name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-node cache: it hashes the dependency tree from a lockfile and
      # errors when none is present. It only speeds up installs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        # npm install, not npm ci: package-lock.json is deliberately untracked so
        # dependencies are reviewed and bumped deliberately rather than drifting
        # in from upstream. That means CI resolves the current tree each run
        # instead of a committed one.
        run: npm install

      # Every workspace must declare what it imports; transitive resolution
      # works until an unrelated package changes its tree.
      - name: Audit dependencies
        run: npm run audit:deps

      # Fails on any new advisory. Advisories with no patched release are listed
      # with their justification in scripts/audit-vulnerabilities.mjs.
      - name: Audit vulnerabilities
        run: npm run audit:vulns

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        # build:apps, not build: typecheck already ran above.
        run: npm run build:apps

  migrations:
    # Migrations only mean something against a real Postgres, and a broken one
    # otherwise surfaces as a failed deploy rather than a failed build.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantstock
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantstock
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Migrate up
        run: npm run --workspace=@workspace/db migrate

      # Leaves the schema at the pre-migration state, which must still apply
      # cleanly, so the down path cannot rot unnoticed.
      - name: Migrate down
        run: npm run --workspace=@workspace/db migrate:down

      - name: Migrate up again
        run: npm run --workspace=@workspace/db migrate
